name: Update Kodelet Formulas

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., 0.1.0). If empty, uses latest release'
        required: false

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using specified version: $VERSION"
          else
            # Get latest release version from the kodelet repository
            VERSION=$(gh release list --repo jingkaihe/kodelet --limit 1 --json tagName --jq '.[0].tagName' | sed 's/^v//')
            echo "Using latest version: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Latest release version: $VERSION"

      - name: Download release assets and calculate checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create temporary directory for downloads
          mkdir -p temp_downloads
          cd temp_downloads

          # Download binaries for all platforms
          echo "Downloading kodelet binaries for version v$VERSION..."

          for binary in kodelet kodelet-audio; do
            targets="darwin-amd64 darwin-arm64 linux-amd64 linux-arm64"
            if [ "$binary" = kodelet-audio ]; then
              targets="darwin-arm64 linux-amd64 linux-arm64"
            fi
            for target in $targets; do
              asset="$binary-$target"
              echo "Downloading $asset..."
              if gh release download "v$VERSION" --repo jingkaihe/kodelet --pattern "$asset"; then
                sha256=$(sha256sum "$asset" | cut -d' ' -f1)
                env_var_name=$(echo "$asset" | tr '[:lower:]-' '[:upper:]_')
                echo "${env_var_name}_SHA256=$sha256" >> $GITHUB_ENV
                echo "SHA256 for $asset: $sha256"
              else
                echo "Failed to download $asset"
                exit 1
              fi
            done
          done

      - name: Generate formulas from templates
        run: |
          for binary in kodelet kodelet-audio; do
            prefix=$(echo "$binary" | tr '[:lower:]-' '[:upper:]_')
            formula=$(sed "s/{{VERSION}}/$VERSION/g" "$binary-template.rb")
            for target in DARWIN_ARM64 DARWIN_AMD64 LINUX_ARM64 LINUX_AMD64; do
              checksum_var="${prefix}_${target}_SHA256"
              formula=$(printf '%s\n' "$formula" | sed "s/{{SHA256_$target}}/${!checksum_var}/g")
            done
            printf '%s\n' "$formula" > "Formula/$binary.rb"
            echo "Generated $binary formula for version $VERSION"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add Formula/kodelet.rb Formula/kodelet-audio.rb
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update kodelet formulas to version $VERSION"
            git push
            echo "Formula updated to version $VERSION"
          fi

      - name: Clean up
        run: rm -rf temp_downloads
